<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://fonts.google.com/specimen/Inter">
    <title>Document</title>
</head>
<body>
    <div class="page-container">
        <header class="header">
            <div class="header-container">
                <h1>Customer Details:</h1>
            </div>
        </header>
        <main>
            <form>
                <div class="form-container">
                    <div class="form-group">
                        <div class="group-heading-container">
                            <h2 class="group-heading">Full Name <span class="red-asterisk">*</span></h2>
                        </div>
                        <div class="input-fields row-fields">
                            <div class="input-box">
                                <input class="custom-input" type="text" name="first_name">
                                <label class="custom-label" for="first_name">First Name</label>
                            </div>
                            <div class="input-box">
                                <input class="custom-input" type="text" name="last_name">
                                <label class="custom-label" for="last_name">Last Name</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="group-heading-container">
                            <h2 class="group-heading">Address <span class="red-asterisk">*</span></h2>
                        </div>
                        <div class="input-box">
                                <input class="custom-input" type="text" name="street_address">
                                <label class="custom-label" for="street_address">Street Address</label>
                        </div>
                        <div class="input-box">
                                <input class="custom-input" type="text" name="street_address_2">
                                <label class="custom-label" for="street_address_2">Street Address Line 2</label>
                        </div>
                        <div class="input-fields row-fields">
                            <div class="input-box">
                                <input class="custom-input" type="text" name="city">
                                <label class="custom-label" for="city">City</label>
                            </div>
                            <div class="input-box">
                                <input class="custom-input" type="text" name="state_province">
                                <label class="custom-label" for="state_province">State/Province</label>
                            </div>
                        </div>
                        <div class="postal-zip input-box">
                                <input class="custom-input" type="text" name="postal_zip">
                                <label class="custom-label" for="postal_zip">Postal/Zip Code</label>                            
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="group-heading-container">
                            <h2 class="group-heading">Phone Number <span class="red-asterisk">*</span></h2>
                        </div>
                        <div class="input-box">
                                <input class="custom-input" type="text">
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="group-heading-container">
                            <h2 class="group-heading">E-mail</h2>
                        </div>
                        <div class="input-box">
                            <input class="custom-input" type="text">
                        </div>
                    </div>
                    <hr>
                    <div class="form-group">
                        <div class="group-heading-container">
                            <h2 class="group-heading">How did you hear about us? <span class="red-asterisk">*</span></h2>
                            <div class="input-box">
                                <select class="custom-input custom-select">
                                    <option value="">Please Select</option>
                                    <option value="friend">From a friend</option>
                                    <option value="social">Social media</option>
                                    <option value="ad">Advertisement</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </main>
        <script type="module" src="js/main.js"></script>
    </div>
</body>
</html>
